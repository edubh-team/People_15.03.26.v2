name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Rules regression tests
        run: npm run test:rules

      - name: Production build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Preflight
        env:
          SH: ${{ secrets.SERVER_HOST }}
          SU: ${{ secrets.SERVER_USER }}
          SK: ${{ secrets.SSH_PRIVATE_KEY }}
          ZMCI: ${{ secrets.ZOHO_MEETING_CLIENT_ID || secrets.ZOHO_CLIENT_ID }}
          ZMCS: ${{ secrets.ZOHO_MEETING_CLIENT_SECRET || secrets.ZOHO_CLIENT_SECRET }}
          ZMRU: ${{ secrets.ZOHO_MEETING_REDIRECT_URI || secrets.ZOHO_REDIRECT_URI }}
        run: |
          if [ -z "$SH" ] || [ -z "$SU" ] || [ -z "$SK" ]; then
            echo "Missing required secrets: HOST, USERNAME, SSH_KEY"
            echo "Please add these to your GitHub Repository Secrets."
            exit 1
          fi

          if [[ "$SK" != *"-----BEGIN"* ]]; then
            echo "Error: SSH_PRIVATE_KEY does not look like a valid private key."
            echo "It should start with '-----BEGIN ... PRIVATE KEY-----'"
            exit 1
          fi
          
          if [ -z "$ZMCI" ] || [ -z "$ZMCS" ] || [ -z "$ZMRU" ]; then
            echo "Missing required Zoho secrets."
            echo "Please add ZOHO_MEETING_CLIENT_ID, ZOHO_MEETING_CLIENT_SECRET, and ZOHO_MEETING_REDIRECT_URI to GitHub Repository Secrets."
            exit 1
          fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ZOHO_MEETING_CLIENT_ID: ${{ secrets.ZOHO_MEETING_CLIENT_ID || secrets.ZOHO_CLIENT_ID }}
          ZOHO_MEETING_CLIENT_SECRET: ${{ secrets.ZOHO_MEETING_CLIENT_SECRET || secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_MEETING_REDIRECT_URI: ${{ secrets.ZOHO_MEETING_REDIRECT_URI || secrets.ZOHO_REDIRECT_URI }}
          ZOHO_MEETING_ACCOUNTS_BASE_URL: ${{ secrets.ZOHO_MEETING_ACCOUNTS_BASE_URL || secrets.ZOHO_ACCOUNTS_BASE_URL }}
          ZOHO_MEETING_API_BASE_URL: ${{ secrets.ZOHO_MEETING_API_BASE_URL || secrets.ZOHO_API_BASE_URL }}
          ZOHO_MEETING_RECORDING_API_BASE_URL: ${{ secrets.ZOHO_MEETING_RECORDING_API_BASE_URL || secrets.ZOHO_RECORDING_API_BASE_URL }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID || secrets.ZOHO_MEETING_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET || secrets.ZOHO_MEETING_CLIENT_SECRET }}
          ZOHO_REDIRECT_URI: ${{ secrets.ZOHO_REDIRECT_URI || secrets.ZOHO_MEETING_REDIRECT_URI }}
          ZOHO_ACCOUNTS_BASE_URL: ${{ secrets.ZOHO_ACCOUNTS_BASE_URL || secrets.ZOHO_MEETING_ACCOUNTS_BASE_URL }}
          ZOHO_API_BASE_URL: ${{ secrets.ZOHO_API_BASE_URL || secrets.ZOHO_MEETING_API_BASE_URL }}
          ZOHO_RECORDING_API_BASE_URL: ${{ secrets.ZOHO_RECORDING_API_BASE_URL || secrets.ZOHO_MEETING_RECORDING_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: ZOHO_MEETING_CLIENT_ID,ZOHO_MEETING_CLIENT_SECRET,ZOHO_MEETING_REDIRECT_URI,ZOHO_MEETING_ACCOUNTS_BASE_URL,ZOHO_MEETING_API_BASE_URL,ZOHO_MEETING_RECORDING_API_BASE_URL,ZOHO_CLIENT_ID,ZOHO_CLIENT_SECRET,ZOHO_REDIRECT_URI,ZOHO_ACCOUNTS_BASE_URL,ZOHO_API_BASE_URL,ZOHO_RECORDING_API_BASE_URL
          script: |
            # Navigate to project directory
            if [ -d "/People" ]; then
              cd /People
            elif [ -d "People" ]; then
              cd People
            elif [ -d "~/People" ]; then
              cd ~/People
            else
              echo "Directory 'People' not found. Current directory: $(pwd)"
              ls -la
              exit 1
            fi

            echo "Deploying in $(pwd)..."

            python3 - <<'PY'
            from pathlib import Path
            import os

            path = Path(".env.local")
            if not path.exists():
                raise SystemExit(".env.local not found on server")

            updates = {
                "ZOHO_MEETING_CLIENT_ID": os.environ.get("ZOHO_MEETING_CLIENT_ID", ""),
                "ZOHO_MEETING_CLIENT_SECRET": os.environ.get("ZOHO_MEETING_CLIENT_SECRET", ""),
                "ZOHO_MEETING_REDIRECT_URI": os.environ.get("ZOHO_MEETING_REDIRECT_URI", ""),
                "ZOHO_MEETING_ACCOUNTS_BASE_URL": os.environ.get("ZOHO_MEETING_ACCOUNTS_BASE_URL", ""),
                "ZOHO_MEETING_API_BASE_URL": os.environ.get("ZOHO_MEETING_API_BASE_URL", ""),
                "ZOHO_MEETING_RECORDING_API_BASE_URL": os.environ.get("ZOHO_MEETING_RECORDING_API_BASE_URL", ""),
                "ZOHO_CLIENT_ID": os.environ.get("ZOHO_CLIENT_ID", "") or os.environ.get("ZOHO_MEETING_CLIENT_ID", ""),
                "ZOHO_CLIENT_SECRET": os.environ.get("ZOHO_CLIENT_SECRET", "") or os.environ.get("ZOHO_MEETING_CLIENT_SECRET", ""),
                "ZOHO_REDIRECT_URI": os.environ.get("ZOHO_REDIRECT_URI", "") or os.environ.get("ZOHO_MEETING_REDIRECT_URI", ""),
                "ZOHO_ACCOUNTS_BASE_URL": os.environ.get("ZOHO_ACCOUNTS_BASE_URL", "") or os.environ.get("ZOHO_MEETING_ACCOUNTS_BASE_URL", ""),
                "ZOHO_API_BASE_URL": os.environ.get("ZOHO_API_BASE_URL", "") or os.environ.get("ZOHO_MEETING_API_BASE_URL", ""),
                "ZOHO_RECORDING_API_BASE_URL": os.environ.get("ZOHO_RECORDING_API_BASE_URL", "") or os.environ.get("ZOHO_MEETING_RECORDING_API_BASE_URL", ""),
            }

            existing = path.read_text(encoding="utf-8").splitlines()
            output = []
            seen = set()

            for line in existing:
                if "=" not in line or line.lstrip().startswith("#"):
                    output.append(line)
                    continue
                key, _ = line.split("=", 1)
                if key in updates and updates[key]:
                    output.append(f"{key}={updates[key]}")
                    seen.add(key)
                else:
                    output.append(line)

            for key, value in updates.items():
                if value and key not in seen:
                    output.append(f"{key}={value}")

            path.write_text("\n".join(output) + "\n", encoding="utf-8")
            PY
            
            # Force sync with GitHub (discard local changes to tracked files)
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f "deploy.sh" ]; then
              chmod +x deploy.sh
              ./deploy.sh
              docker exec people-hrms env | grep ZOHO
            else
              echo "deploy.sh not found!"
              exit 1
            fi
